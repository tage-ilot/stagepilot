[package]
name = "stagepilot-desktop"
version = "2.42.0-rc.3"
description = "Native desktop shell for StagePilot"
authors = ["StagePilot contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[lib]
name = "stagepilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Default build: the packaged Python sidecar (PyInstaller) stays the backend. `in-process` links
# the Rust `stagepilot-server` into this process instead (Rust migration phase 6d).
in-process = ["dep:stagepilot-server"]

[dependencies]
stagepilot-server = { path = "../../crates/stagepilot-server", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-window-state = "=2.4.1"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.3"
tokio = { version = "1", features = ["time"] }
getrandom = "0.2"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# The installers ship on Windows and macOS, where MIDI hardware goes through midir (WinMM / CoreMIDI).
# Without this the in-process server refuses to start on any settings that send MIDI ("built without
# MIDI hardware support"), which is what v2.42.0-rc.3 did. Linux is not shipped and its midir needs
# ALSA headers the CI runner does not have, so the feature stays off there.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
stagepilot-server = { path = "../../crates/stagepilot-server", optional = true, features = ["midir-backend"] }

# Lets the shell's own tests assert the feature really is on in the build that ships.
[target.'cfg(any(windows, target_os = "macos"))'.dev-dependencies]
stagepilot-midi = { path = "../../crates/stagepilot-midi" }
