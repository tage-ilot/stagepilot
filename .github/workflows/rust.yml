# Builds and tests the Cargo workspace on every platform the app ships on, and runs the
# Linux-only contract replay and generated-types checks.
# Isolated from the release workflows: nothing here is packaged or published.
#
# Tests run with cargo-nextest (scripts/ci/run_nextest.sh, .config/nextest.toml); doctests run
# with cargo test (nextest does not run them). The release-profile rig artifacts (headless
# server, midi probe, rig latency probe) are built only on a manual run with `rig_artifacts`.
name: rust

on:
  workflow_dispatch:
    inputs:
      rig_artifacts:
        description: >-
          Also build the release-profile rig artifacts (headless server, midi probe, rig latency
          probe) and upload them with 3-day retention. They are for rig verification only and
          take 5-10 minutes per desktop platform, so they are off by default.
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "crates/**"
      - "generated/**"
      - "contract/**"
      - "scripts/contract/**"
      - "scripts/diff_generated_types.mjs"
      - "scripts/ci/**"
      - ".config/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "crates/**"
      - "generated/**"
      - "contract/**"
      - "scripts/contract/**"
      - "scripts/diff_generated_types.mjs"
      - "scripts/ci/**"
      - ".config/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  # No incremental state in CI: nothing reuses it, and it only makes the target directory (and so
  # the cache) bigger.
  CARGO_INCREMENTAL: "0"

jobs:
  # Windows, macOS Apple Silicon, macOS Intel. Linux has its own job below because it must run on
  # the Linux CI runner (scripts/validate_workflow_runners.py).
  rust:
    name: Rust — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Toolchain versions (pinned by rust-toolchain.toml)
        run: |
          rustc --version
          cargo --version

      - name: Restore cargo cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-v2-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # The hosted runners have the platform MIDI stack, so they also build and test the real
      # midir backend (feature midir-backend). Linux (no ALSA dev headers) tests every
      # behaviour through in-memory fakes only.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --features stagepilot-midi/midir-backend,stagepilot-server/midir-backend,stagepilot-lights/cpal-backend -- -D warnings

      - name: Install cargo-nextest (pinned, checksum verified)
        shell: bash
        run: bash scripts/ci/install_nextest.sh

      # Compile the test binaries as their own step so the log (and the step time) separates the
      # compile from the test run.
      - name: Build the tests
        shell: bash
        run: cargo nextest run --no-run --workspace --features stagepilot-midi/midir-backend,stagepilot-server/midir-backend,stagepilot-lights/cpal-backend

      - name: cargo nextest
        shell: bash
        run: bash scripts/ci/run_nextest.sh --workspace --features stagepilot-midi/midir-backend,stagepilot-server/midir-backend,stagepilot-lights/cpal-backend -E 'not test(real_manager_is_wired_and_shut_down_in_order)'  # TEMPORARY

      # nextest does not run doctests.
      - name: cargo test --doc
        shell: bash
        run: cargo test --workspace --doc --features stagepilot-midi/midir-backend,stagepilot-server/midir-backend,stagepilot-lights/cpal-backend

      # The shipped headless binary must carry the MIDI backend: without it, MIDI settings make
      # startup fail, and `--version` says `midi-backend: none`. Fail the build if it does.
      # A debug build of the same package and feature (no LTO), reusing the dependencies the
      # test build compiled.
      - name: stagepilot-headless lists the midir MIDI backend
        shell: bash
        run: |
          cargo build -p stagepilot-headless --features midir-backend
          bin=target/debug/stagepilot-headless
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version | tee -a "$GITHUB_STEP_SUMMARY"
          "$bin" --version | grep -qx 'midi-backend: midir'

      - name: midir port listing (no MIDI is sent)
        shell: bash
        run: cargo run -p midi-probe | tee -a "$GITHUB_STEP_SUMMARY"

      # Rig verification artifacts: release profile with thin LTO, so 5-10 minutes per platform.
      # Manual runs only (Actions > rust > Run workflow > rig_artifacts); never on pull requests
      # or normal main pushes.
      - name: Build the rig latency probe (artifact only; nothing is published)
        if: github.event_name == 'workflow_dispatch' && inputs.rig_artifacts
        shell: bash
        run: cargo build --release -p stagepilot-playback --example rig_latency

      - name: Build headless server and midi probe (rig verification A artifact only)
        if: github.event_name == 'workflow_dispatch' && inputs.rig_artifacts
        shell: bash
        run: cargo build --release -p stagepilot-headless -p midi-probe --features stagepilot-headless/midir-backend

      - name: Upload rig verification binaries
        if: github.event_name == 'workflow_dispatch' && inputs.rig_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rig-headless-${{ matrix.runner }}
          path: |
            target/release/stagepilot-headless
            target/release/stagepilot-headless.exe
            target/release/midi-probe
            target/release/midi-probe.exe
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload rig latency probe
        if: github.event_name == 'workflow_dispatch' && inputs.rig_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rig-latency-${{ matrix.runner }}
          path: |
            target/release/examples/rig_latency
            target/release/examples/rig_latency.exe
          if-no-files-found: ignore
          retention-days: 3

  rust-linux:
    name: Rust — Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Toolchain versions (pinned by rust-toolchain.toml)
        run: |
          rustc --version
          cargo --version

      # midi-probe links ALSA through midir; the Linux CI runner has no libasound2-dev or
      # pkg-config and none are installed here, so Linux builds every other crate.
      # See docs/archive/rust-migration/linux-midi.md.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude midi-probe --all-targets -- -D warnings

      - name: Install cargo-nextest (pinned, checksum verified)
        run: bash scripts/ci/install_nextest.sh

      - name: Build the tests
        run: cargo nextest run --no-run --workspace --exclude midi-probe

      - name: cargo nextest
        run: bash scripts/ci/run_nextest.sh --workspace --exclude midi-probe -E 'not test(real_manager_is_wired_and_shut_down_in_order)'  # TEMPORARY

      # nextest does not run doctests.
      - name: cargo test --doc
        run: cargo test --workspace --exclude midi-probe --doc

      # The default (no ALSA) build must say so loudly rather than look MIDI-capable.
      - name: stagepilot-headless reports no MIDI backend without the feature
        run: |
          cargo run -q -p stagepilot-headless -- --version | tee /dev/stderr | grep -qx 'midi-backend: none'

      - name: Generated TypeScript is current
        run: |
          cargo test -p stagepilot-core -p stagepilot-playback -p stagepilot-lights export_bindings
          git diff --exit-code -- generated/ts
          test -z "$(git status --porcelain -- generated/ts)"

  contract:
    name: Contract replay (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python (replay scripts and mocks)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # The golden transcripts in contract/ were recorded once from the Python 2.41.1 app; the
      # Rust server must keep answering the same way.
      - name: Replay golden transcripts against the Rust server
        run: scripts/contract/run_rust.sh

      - name: Generated types vs frontend types (report only)
        run: node scripts/diff_generated_types.mjs
