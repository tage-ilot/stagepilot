name: Release validation (dry run)

# Runs the exact "Validate application" commands of the release workflows
# (scripts/validate_application.sh) on every release platform, without a tag, secrets, an
# environment or any publishing. Run it on main before cutting a tag: a green run is the gate.
# See docs/creating-a-release.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macOS Apple Silicon, runner: macos-15}
          - {name: macOS Intel, runner: macos-15-intel}
          - {name: Windows x64, runner: windows-latest}
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
          rustup update stable
          rustup default stable
      - name: Generate macOS Help Book
        if: runner.os == 'macOS'
        run: npm --prefix desktop run build:help
      - name: Validate application
        shell: bash
        run: bash scripts/validate_application.sh
