# Rust migration phase 0 spike. Isolated: builds only spikes/rust-playback, touches nothing shipped.
name: spike-rust

on:
  workflow_dispatch:
  push:
    branches:
      - spike/rust-playback-client

permissions:
  contents: read

concurrency:
  group: spike-rust
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: spikes/rust-playback
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Restore cargo cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spikes/rust-playback/target
          key: spike-rust-${{ matrix.runner }}-${{ hashFiles('spikes/rust-playback/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        shell: bash
        run: |
          start=$(date +%s)
          cargo test --workspace
          echo "test_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"

      - name: cargo build --release
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --release --workspace --examples
          echo "release_build_seconds=$(( $(date +%s) - start )) cache_hit=${{ steps.cache.outputs.cache-hit }} runner=${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"

      - name: midir port listing (no MIDI is sent)
        shell: bash
        run: |
          cargo run --release -p midi-probe | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Benchmark (Rust only, local fake Playback)
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          ./target/release/examples/fake_playback$ext 200 5 > fake.out &
          fake_pid=$!
          sleep 1
          port=$(awk '{print $2}' fake.out | head -1)
          ./target/release/examples/bench$ext "$port" | tee -a "$GITHUB_STEP_SUMMARY" || true
          kill $fake_pid || true
          ls -l "target/release/examples/bench$ext" "target/release/examples/fake_playback$ext"
