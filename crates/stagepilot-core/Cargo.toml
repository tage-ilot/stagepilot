[package]
name = "stagepilot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
serde_json = "1.0.154"

[dependencies]
argon2 = { version = "0.6", features = ["password-hash", "alloc", "getrandom"] }
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
futures-util = "0.3.34"
hex = "0.4"
regex = "1"
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
rand = "0.9.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1.41"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3.23.1"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync", "test-util"] }
