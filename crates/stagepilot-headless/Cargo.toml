[package]
name = "stagepilot-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "stagepilot-headless"
path = "src/main.rs"

[features]
# Real MIDI hardware through midir (see crates/stagepilot-midi).
midir-backend = ["stagepilot-server/midir-backend", "stagepilot-midi/midir-backend"]

[dependencies]
stagepilot-server = { path = "../stagepilot-server" }
stagepilot-midi = { path = "../stagepilot-midi" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
