[package]
name = "stagepilot-propresenter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
stagepilot-core = { path = "../stagepilot-core" }
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
# Plain HTTP only (ProPresenter's local API): no TLS stack, so nothing extra to build per OS.
reqwest = { version = "0.13.4", default-features = false }
# Cargo unifies reqwest features across the workspace: with Planning Center in the build, reqwest
# is "rustls-no-provider" for every crate, so a provider must be installed before any Client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1.41"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
