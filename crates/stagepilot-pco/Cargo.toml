[package]
name = "stagepilot-pco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
stagepilot-core = { path = "../stagepilot-core" }
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
futures-util = "0.3.34"
rand = "0.9.2"
# rustls with the pure `ring` provider: no cmake/NASM needed on any CI runner.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1.41"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
url = "2"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }
