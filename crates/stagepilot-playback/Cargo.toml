[package]
name = "stagepilot-playback"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
futures-util = "0.3.34"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
tokio-tungstenite = "0.30.0"
stagepilot-core = { path = "../stagepilot-core" }
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
tracing = "0.1.41"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl"] }


[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
