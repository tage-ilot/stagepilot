[package]
name = "stagepilot-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
hostname = "0.4"
rand = "0.9.2"
regex = "1"
# rustls with the pure `ring` provider: no cmake/NASM needed on any CI runner.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.23.1"
thiserror = "2.0.17"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1.41"
url = "2"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }
